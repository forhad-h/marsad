[package]
name = "marsad"
version = "0.6.0"
edition = "2024"
description = "A live terminal dashboard for all your Claude Code sessions"
license = "MIT"
repository = "https://github.com/forhad-h/marsad"
homepage = "https://github.com/forhad-h/marsad"
readme = "README.md"
keywords = ["claude", "claude-code", "tui", "dashboard"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
ratatui = "0.30.2"
resvg = { version = "0.48.1", default-features = false, features = ["text"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sysinfo = "0.39.6"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
